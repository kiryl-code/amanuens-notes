site_name: Amanuensanteckningar
repo_url: https://github.com/kiryl-code/amanuens-notes
repo_name: kiryl-code/amanuens-notes
theme:
  name: material
  icon:
    logo: material/notebook
    repo: fontawesome/brands/github
  language: sv
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Byt till mörkt läge
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Byt till ljust läge
  features:
    - navigation.sections

nav:
  - "Börja här": index.md
  - "Utveckling pågår": schedule.md
  - "Allmänna guider":
      - "Markdown": general/markdown.md
      - "Terminal": general/terminal.md
  - "Webbutveckling (frontend)":
    - "Verktyg & Tekniker":
        - "Utvecklingsmiljö": tools-and-techniques/tools.md
        - "Emmet": tools-and-techniques/emmet.md
        - "Att koppla externa filer": tools-and-techniques/linking-to-files.md
        - "Att tänka i block": tools-and-techniques/block-thinking.md
  #      - "Utvecklarverktyg i webbläsare": "tools-and-techniques/developer-tools.md"
    - "HTML":
        - "HTML": html/html.md
        - "HTML syntax": html/html-syntax.md
        - "Struktur för ett HTML5-dokument": html/html-structure.md
        - "Kodstil": html/html-code-style.md
        - "De vanligaste HTML-elementen": html/common-elements.md
        - "Semantik": html/semantics.md
        - "Tillgänglighet": html/accessibility.md
    - "CSS":
        - "CSS": css/css.md
        - "Att koppla CSS till HTML": css/link-css.md
        - "CSS selectors": css/css-selectors.md
        - "Kodstil": css/css-codestyle.md
        - "Box-modellen": css/box-model.md
        - "Display: inline & block": css/inline-block.md
        - "Flexbox": css/flexbox.md
        - "Grid": css/grid.md
        - "Variabler i CSS": css/variables.md
        - "Font-face": css/font-face.md
        - "Responsivitet": css/responsiveness.md
        - "Relativa enheter": css/relative-units.md
        - "Media queries": css/media-queries.md
    - "JavaScript":
        - "JavaScript": javascript/js.md
        - "Att koppla JavaScript till HTML": javascript/link-js.md
        - "JavaScript syntax": javascript/js-syntax.md
        - "Objekt i JavaScript": javascript/objects-in-js.md
        - "Att komma åt HTML-element från JavaScript": javascript/js-selectors.md
        - "Manipulera HTML element med JavaScript": javascript/manipulate-elements.md
        - "Manipulera DOM med JavaScript": javascript/manipulate-dom.md
        - "Callbacks, anonyma funktioner och lambda": "javascript/callbacks-and-lambda.md"
        - "Events": javascript/events.md
markdown_extensions:
  - markdown_extension
  - fenced_code
  - codehilite
  - toc
  - nl2br
  - sane_lists
  - tables
  - footnotes
  - pymdownx.keys
  - pymdownx.blocks.tab:
      alternate_style: true
      combine_header_slug: true

extra_css:
  - _engine/stylesheets/custom_styles.css
  - _engine/stylesheets/darcula.css