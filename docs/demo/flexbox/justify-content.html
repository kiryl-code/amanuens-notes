<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Flexbox demo (DV045G - webbutveckling med inriktning frontend)</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    div, body {
      margin: 0;
      padding: 0;
    }
    
    body {
      min-height: 100vh;
      width: 100vw;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif
    }

    h1 {
      font-size: 18px;
    }
    
    h2 {
      margin-top: 48px;
      font-size: 16px;
    }
    
    code {
      font-family: Melno,Consolas,monospace;
      border-radius: 6px;
      padding: 3px 12px;
      color: #9f4511;
      background-color: #f2f4f4;
      border: 1px solid #e8eaec;
    }

    .no-margin-top {
      margin-top: 0 !important;
    }

    .rectangle {
      width: 100px;
      height: 50px;
    }

    .red {
      background-color: red;
    }

    .green {
      background-color: green;
    }

    .blue {
      background-color: blue;
    }

    .flex-container {
      display: flex;
      width: 100%;
      height: fit-content;
      border: 1px solid black;
    }
    
    .space-between {
      justify-content: space-between;
    }
    
    .space-evenly {
      justify-content: space-evenly;
    }

    .space-around {
      justify-content: space-around;
    }
    
    .justify-center {
      justify-content: center;
    }
    
    .justify-start {
      justify-content: flex-start;
    }
    
    .justify-end {
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <h1>Se hur olika flexbox egenskaper fungerar i praktitken - <code>justify-content</code></h1>
  <h2 class="no-margin-top"><code>justify-content: space-between</code></h2>
  <div class="flex-container space-between">
    <div class="rectangle red"></div>
    <div class="rectangle green"></div>
    <div class="rectangle blue"></div>
  </div>
  <h2><code>justify-content: space-evenly</code></h2>
  <div class="flex-container space-evenly">
    <div class="rectangle red"></div>
    <div class="rectangle green"></div>
    <div class="rectangle blue"></div>
  </div>
  <h2><code>justify-content: space-around</code></h2>
  <div class="flex-container space-around">
    <div class="rectangle red"></div>
    <div class="rectangle green"></div>
    <div class="rectangle blue"></div>
  </div>
  <h2><code>justify-content: center</code></h2>
  <div class="flex-container justify-center">
    <div class="rectangle red"></div>
    <div class="rectangle green"></div>
    <div class="rectangle blue"></div>
  </div>
  <h2><code>justify-content: flex-start</code></h2>
  <div class="flex-container justify-start">
    <div class="rectangle red"></div>
    <div class="rectangle green"></div>
    <div class="rectangle blue"></div>
  </div>
  <h2><code>justify-content: flex-end</code></h2>
  <div class="flex-container justify-end">
    <div class="rectangle red"></div>
    <div class="rectangle green"></div>
    <div class="rectangle blue"></div>
  </div>
</body>
</html>
