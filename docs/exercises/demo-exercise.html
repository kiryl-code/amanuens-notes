<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Exempelquiz</title>
    <script src="engine/main.js" type="module"></script>
    <link rel="stylesheet" href="engine/styles/main.css">
    <link rel="stylesheet" href="engine/styles/custom_styles.css">
</head>
<body>
    
    <form action="" data-exercise-type="answerAlternativeExercise">
        <div class="question-body">
            <p>Välj det korrekta alternativet och tryck sedan på "Kontrollera"</p>
        </div>
        
        <div class="alternative">
            <input
                type="radio"
                name="question1"
                id="q1_answer1"
                class="answer correct"
            >
            <label for="q1_answer1">Korrekt alternativ</label>
        </div>
        
        <div class="alternative">
            <input
                type="radio"
                name="question1"
                id="q1_answer2"
                class="answer"
            >
            <label for="q1_answer2">Fel alternativ</label>
        </div>
        
        <div class="explanations">
            <p class="resultCorrect hidden">Korrekt!</p>
            <p class="resultIncorrect hidden">Inte riktigt...</p>
            
            <div class="explanationCorrect hidden">
                <p>Du fattar hur det funkar. Bra! 😎</p>
            </div>
            
            
            <div class="explanationIncorrect hidden">
                <p>Du skulle ju välja ett korrekt alternativ... 🫤</p>
            </div>
            
        </div>
        <div class="controls">
            <button type="submit">Kontrollera</button>
            <button type="reset">Återställ</button>
        </div>
    </form>
    
    
</body>
</html>
