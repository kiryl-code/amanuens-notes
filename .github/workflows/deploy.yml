name: Deploy MkDocs

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install mkdocs
          pip install mkdocs-material
          pip install pyyaml
          pip install jinja2
          pip install -e .

      - name: Build exercises
        run: python3 exercises_generator.py

      - name: Build and Deploy to GitHub Pages
        run: mkdocs gh-deploy --remote-branch production-site --force